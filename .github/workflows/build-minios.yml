name: Build MiniOS Custom ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clone MiniOS repository
        uses: actions/checkout@v5
        with:
          repository: minios-linux/minios-live
          path: minios-live

      # ... (all your build steps remain exactly the same) ...

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v5
        with:
          name: minios-custom.iso
          path: ./output/*.iso
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: minios-custom.iso
          path: ./
      
      - name: Get ISO filename
        id: iso
        run: |
          ISO_FILE=$(ls *.iso 2>/dev/null | head -1)
          echo "filename=$ISO_FILE" >> $GITHUB_OUTPUT
          echo "Found ISO: $ISO_FILE"
      
      - name: Delete existing latest release
        if: steps.iso.outputs.filename != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest --repo ${{ github.repository }} &>/dev/null; then
            gh release delete latest --repo ${{ github.repository }} --yes
          fi
      
      - name: Create new latest release
        if: steps.iso.outputs.filename != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISO_FILE="${{ steps.iso.outputs.filename }}"
          
          gh release create latest "$ISO_FILE" \
            --title "MiniOS Custom ISO (Latest Build)" \
            --notes "## MiniOS Custom ISO - Latest Build
          
          ### Build Information
          - **Build Number:** #${{ github.run_number }}
          - **Commit:** ${{ github.sha }}
          - **Branch:** ${{ github.ref_name }}
          - **Build Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          ### Download
          Click on the asset below to download the ISO file.
          
          ### SHA256 Checksum
          \`\`\`
          $(sha256sum "$ISO_FILE")
          \`\`\`
          
          ---
          *This release is automatically updated on every successful build.*
          " \
            --repo ${{ github.repository }}
