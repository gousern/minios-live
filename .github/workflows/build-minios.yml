- name: Install minios-tools from official APT repo
  run: |
    # Download and add MiniOS GPG key from the master branch
    sudo curl -fsSL https://github.com/minios-linux/deb/raw/refs/heads/master/minios-linux.asc -o /etc/apt/trusted.gpg.d/minios-linux.gpg

    # Add the repository
    sudo bash -c 'echo "deb http://deb.minios.dev/debian bookworm main contrib non-free" > /etc/apt/sources.list.d/minios-linux.list'
    sudo bash -c 'echo "deb http://deb.minios.dev/debian generic main contrib non-free" >> /etc/apt/sources.list.d/minios-linux.list'

    # Update and install minios-tools
    sudo apt-get update
    sudo apt-get install -y minios-tools

    # Verify installation
    echo "=== Verifying script2sb installation ==="
    which script2sb
    script2sb --help || echo "script2sb installed successfully"
