name: Build MiniOS Custom ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clone MiniOS repository
        uses: actions/checkout@v5
        with:
          repository: minios-linux/minios-live
          path: minios-live

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap xorriso genisoimage binutils squashfs-tools \
            grub-pc-bin grub-efi-amd64-bin dosfstools mtools xz-utils zstd \
            rsync gettext curl wget gpg

      - name: Setup custom packages and configurations
        run: |
          cd minios-live
          
          # ============================================
          # 1. Package lists (套件清單)
          # ============================================
          mkdir -p config/package-lists/
          cat > config/package-lists/custom.list.chroot << 'EOF'
          git curl wget ca-certificates
          build-essential dkms linux-headers-amd64
          wireguard-tools openresolv
          qemu-system-x86 qemu-utils qemu-kvm ovmf
          x11-xserver-utils x11-utils vim htop
          fonts-noto-cjk fonts-noto-color-emoji
          fonts-wqy-zenhei fonts-wqy-microhei
          fonts-liberation fonts-dejavu
          ibus ibus-chewing
          oneko
          EOF
          
          # ============================================
          # 2. Cloudflare GPG key and repository
          # ============================================
          mkdir -p config/chroot-sources/
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg \
            -o config/chroot-sources/cloudflare-archive-keyring.gpg
          
          cat > config/chroot-sources/cloudflare.list << 'EOF'
          deb [signed-by=/usr/share/keyrings/cloudflare-archive-keyring.gpg] https://pkg.cloudflare.com/ trixie main
          EOF
          
          # ============================================
          # 3. Configuration files (includes.chroot)
          #    These will be copied by minios-cmd at build time
          # ============================================
          
          # 3a. Fontconfig - Chinese fonts preference
          mkdir -p config/includes.chroot/etc/fonts/conf.d/
          cat > config/includes.chroot/etc/fonts/conf.d/99-language-selector-zh.conf << 'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
              <alias>
                  <family>sans-serif</family>
                  <prefer>
                      <family>Noto Sans CJK TC</family>
                      <family>WenQuanYi Zen Hei</family>
                      <family>Noto Sans</family>
                  </prefer>
              </alias>
              <alias>
                  <family>serif</family>
                  <prefer>
                      <family>Noto Serif CJK TC</family>
                      <family>WenQuanYi Zen Hei</family>
                      <family>Noto Serif</family>
                  </prefer>
              </alias>
              <alias>
                  <family>monospace</family>
                  <prefer>
                      <family>Noto Sans Mono CJK TC</family>
                      <family>WenQuanYi Zen Hei Mono</family>
                      <family>Noto Mono</family>
                  </prefer>
              </alias>
          </fontconfig>
          EOF
          
          # 3b. IBus default configuration
          mkdir -p config/includes.chroot/etc/default/
          cat > config/includes.chroot/etc/default/ibus << 'EOF'
          IBUS_ENABLE_CTRL_ALT_GR=1
          EOF
          
          # 3c. X11 keyboard - XKB configuration
          mkdir -p config/includes.chroot/etc/X11/xorg.conf.d/
          cat > config/includes.chroot/etc/X11/xorg.conf.d/00-keyboard.conf << 'EOF'
          Section "InputClass"
              Identifier "keyboard"
              MatchIsKeyboard "on"
              Option "XkbLayout" "us,cn"
              Option "XkbVariant" "mac,"
              Option "XkbOptions" "ctrl:swapcaps,altwin:swap_alt_win,grp:alt_shift_toggle"
          EndSection
          EOF
          
          # 3d. X11 xmodmap - macOS style key mapping
          mkdir -p config/includes.chroot/etc/X11/xmodmap/
          cat > config/includes.chroot/etc/X11/xmodmap/macos.xmodmap << 'EOF'
          ! macOS style keyboard mapping
          clear control
          clear mod1
          clear mod4
          clear lock
          
          ! Alt -> Cmd (Super), Win -> Alt (Option)
          keycode 64  = Alt_L Meta_L
          keycode 133 = Super_L
          keycode 134 = Super_R
          keycode 108 = Alt_R Meta_R
          
          ! CapsLock -> Control
          keycode 66  = Control_L
          
          ! Navigation keys
          keycode 110 = Home
          keycode 115 = End
          keycode 112 = Prior
          keycode 117 = Next
          
          ! Reassign modifier keys
          add control = Control_L Control_R
          add mod1    = Alt_L Meta_L Alt_R Meta_R
          add mod4    = Super_L Super_R
          add lock    = Caps_Lock
          EOF
          
          # 3e. GTK shortcuts - macOS style
          mkdir -p config/includes.chroot/etc/gtk-3.0/
          cat > config/includes.chroot/etc/gtk-3.0/accels.scm << 'EOF'
          ; GTK macOS style shortcuts (Cmd -> Super)
          (gtk_accel_path "<Actions>/GeditWindow/New" "<Super>n")
          (gtk_accel_path "<Actions>/GeditWindow/Open" "<Super>o")
          (gtk_accel_path "<Actions>/GeditWindow/Save" "<Super>s")
          (gtk_accel_path "<Actions>/GeditWindow/SaveAs" "<Super><Shift>s")
          (gtk_accel_path "<Actions>/GeditWindow/Close" "<Super>w")
          (gtk_accel_path "<Actions>/GeditWindow/Quit" "<Super>q")
          (gtk_accel_path "<Actions>/GeditWindow/Undo" "<Super>z")
          (gtk_accel_path "<Actions>/GeditWindow/Redo" "<Super><Shift>z")
          (gtk_accel_path "<Actions>/GeditWindow/Cut" "<Super>x")
          (gtk_accel_path "<Actions>/GeditWindow/Copy" "<Super>c")
          (gtk_accel_path "<Actions>/GeditWindow/Paste" "<Super>v")
          (gtk_accel_path "<Actions>/GeditWindow/SelectAll" "<Super>a")
          (gtk_accel_path "<Actions>/GeditWindow/Find" "<Super>f")
          (gtk_accel_path "<Actions>/GeditWindow/Replace" "<Super>r")
          EOF
          
          # 3f. User autostart - custom settings script
          mkdir -p config/includes.chroot/home/live/.config/autostart/
          cat > config/includes.chroot/home/live/.config/autostart/custom-settings.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Custom Settings
          Exec=/bin/bash -c "sleep 2 && ~/.config/autostart/custom-settings.sh"
          Hidden=false
          NoDisplay=false
          X-GNOME-Autostart-enabled=true
          EOF
          
          cat > config/includes.chroot/home/live/.config/autostart/custom-settings.sh << 'EOF'
          #!/bin/bash
          
          # Set resolution
          xrandr -s 1280x800 2>/dev/null || true
          
          # Load macOS keyboard mapping
          setxkbmap -layout us,cn -variant mac, -option "ctrl:swapcaps,altwin:swap_alt_win,grp:alt_shift_toggle"
          
          if [ -f /etc/X11/xmodmap/macos.xmodmap ]; then
              xmodmap /etc/X11/xmodmap/macos.xmodmap
          fi
          
          # Start IBus for Chinese input
          if command -v ibus-daemon &> /dev/null; then
              ibus-daemon -drx &
          fi
          
          # Start oneko
          if command -v oneko &> /dev/null; then
              oneko &
          fi
          
          exit 0
          EOF
          chmod +x config/includes.chroot/home/live/.config/autostart/custom-settings.sh
          
          # 3g. Live user .bashrc - PATH and environment
          cat >> config/includes.chroot/home/live/.bashrc << 'BASHRC'
          
          # Custom PATH (include ~/bin)
          export PATH="$HOME/bin:$HOME/.local/bin:$PATH"
          
          # Timezone
          export TZ="Asia/Taipei"
          
          # IBus environment for Chinese input
          export GTK_IM_MODULE=ibus
          export QT_IM_MODULE=ibus
          export XMODIFIERS=@im=ibus
          
          # Mise (if installed)
          if [ -f "$HOME/.local/bin/mise" ]; then
              eval "$(mise activate bash)"
          fi
          BASHRC
          
          # 3h. Create ~/bin directory for user
          mkdir -p config/includes.chroot/home/live/bin/
          
          # ============================================
          # 4. Hook script (only for dynamic operations)
          #    Installing packages, DKMS, Mise, cleanup
          # ============================================
          mkdir -p config/hooks/normal/
          cat > config/hooks/normal/01-custom-setup.chroot << 'EOF'
          #!/bin/bash
          set -e
          
          echo "=== Custom Setup Hook Started ==="
          
          # ============================================
          # APT third-party sources
          # ============================================
          if [ -f /etc/apt/cloudflare-archive-keyring.gpg ]; then
              mkdir -p /usr/share/keyrings/
              cp /etc/apt/cloudflare-archive-keyring.gpg /usr/share/keyrings/
          fi
          if [ -f /etc/apt/cloudflare.list ]; then
              cp /etc/apt/cloudflare.list /etc/apt/sources.list.d/
          fi
          if [ -f /etc/apt/sources.list.d/cloudflare.list ]; then
              apt-get update -o Dir::Etc::sourcelist="/etc/apt/sources.list.d/cloudflare.list" \
                              -o Dir::Etc::sourceparts="/dev/null" || true
          fi
          
          # ============================================
          # DKMS modules (needs kernel headers)
          # ============================================
          if command -v dkms &> /dev/null && dpkg -l | grep -q linux-headers-amd64; then
              apt-get install -y apfs-dkms broadcom-sta-dkms || echo "WARNING: DKMS modules failed"
              dkms autoinstall || echo "WARNING: DKMS build failed"
          fi
          
          # ============================================
          # Cloudflare Warp
          # ============================================
          if [ -f /etc/apt/sources.list.d/cloudflare.list ]; then
              apt-get install -y cloudflare-warp || echo "WARNING: Warp installation failed"
          fi
          
          # ============================================
          # Mise (live user only)
          # ============================================
          if command -v curl &> /dev/null; then
              sudo -u live bash -c "curl https://mise.run | sh" || echo "WARNING: Mise installation failed"
          fi
          
          # ============================================
          # Locale and Timezone
          # ============================================
          echo "zh_TW.UTF-8 UTF-8" >> /etc/locale.gen
          echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
          locale-gen
          update-locale LANG=en_US.UTF-8 LANGUAGE=en_US:en LC_ALL=en_US.UTF-8
          
          echo "Asia/Taipei" > /etc/timezone
          dpkg-reconfigure -f noninteractive tzdata
          ln -sf /usr/share/zoneinfo/Asia/Taipei /etc/localtime 2>/dev/null || true
          
          # ============================================
          # FULL CLEANUP - Reduce ISO size
          # ============================================
          echo "=== Full cleanup started ==="
          
          # APT cleanup
          apt-get clean
          apt-get autoclean
          apt-get autoremove --purge -y
          
          # Remove APT cache
          rm -rf /var/lib/apt/lists/*
          rm -rf /var/cache/apt/*.bin
          rm -rf /var/cache/apt/archives/*.deb
          
          # Remove temp files
          rm -rf /tmp/*
          rm -rf /var/tmp/*
          
          # Truncate logs
          find /var/log -type f -name "*.log" -exec truncate -s 0 {} \; 2>/dev/null || true
          rm -rf /var/log/*.gz /var/log/*.1 /var/log/*.old 2>/dev/null || true
          
          # Remove man pages and docs
          rm -rf /usr/share/man/* 2>/dev/null || true
          rm -rf /usr/share/doc/* 2>/dev/null || true
          rm -rf /usr/share/info/* 2>/dev/null || true
          rm -rf /usr/share/gnome/help/* 2>/dev/null || true
          
          # Remove unwanted locales (keep en_US and zh_TW only)
          find /usr/share/locale -mindepth 1 -maxdepth 1 -type d \
            ! -name "en" ! -name "en_US" ! -name "zh" ! -name "zh_TW" ! -name "locale.alias" \
            -exec rm -rf {} \; 2>/dev/null || true
          
          # Remove Python cache
          find /usr/share -name "*.pyc" -delete 2>/dev/null || true
          find /usr/share -name "__pycache__" -type d -exec rm -rf {} \; 2>/dev/null || true
          
          # Remove bash history
          rm -f /root/.bash_history /home/live/.bash_history 2>/dev/null || true
          
          # Extra cleanup
          echo "=== Extra cleanup started ==="
          
          # Remove unnecessary kernel modules
          rm -rf /lib/modules/*/kernel/drivers/staging 2>/dev/null || true
          rm -rf /lib/modules/*/kernel/drivers/media 2>/dev/null || true
          
          # Remove extra kernel headers
          rm -rf /usr/src/linux-headers-* 2>/dev/null || true
          
          # Remove unnecessary X11 drivers
          rm -rf /usr/lib/xorg/modules/drivers/*_drv.so 2>/dev/null || true
          
          # Remove unnecessary fonts
          find /usr/share/fonts -type f \( -name "*.pcf" -o -name "*.pcf.gz" \) -delete 2>/dev/null || true
          
          # Remove unnecessary icons
          find /usr/share/icons -mindepth 1 -maxdepth 1 -type d \
            ! -name "hicolor" ! -name "default" ! -name "Adwaita" \
            -exec rm -rf {} \; 2>/dev/null || true
          
          # Remove unnecessary themes
          find /usr/share/themes -mindepth 1 -maxdepth 1 -type d \
            ! -name "Default" ! -name "Adwaita" \
            -exec rm -rf {} \; 2>/dev/null || true
          
          # Remove unnecessary sound files
          rm -rf /usr/share/sounds/* 2>/dev/null || true
          
          # Remove unnecessary wallpapers
          rm -rf /usr/share/backgrounds/* 2>/dev/null || true
          
          # Remove unnecessary applications menu entries
          rm -rf /usr/share/applications/*.desktop 2>/dev/null || true
          
          echo "=== Cleanup completed ==="
          echo "=== Disk usage after full cleanup ==="
          df -h /
          du -sh /usr/share 2>/dev/null || echo "usr/share cleaned"
          
          echo "=== Custom Setup Hook Completed ==="
          EOF
          
          chmod +x config/hooks/normal/01-custom-setup.chroot

      - name: Build MiniOS ISO
        working-directory: ./minios-live
        run: |
          sudo ./minios-cmd -d trixie -a amd64 -de xfce -pv standard -dkms -kl -c zstd -tz Asia/Taipei

      - name: Collect ISO files
        run: |
          mkdir -p ./output
          find ./minios-live/build/iso -name "*.iso" -exec cp {} ./output/ \;
          echo "ISO file list:"
          ls -lh ./output/

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v5
        with:
          name: minios-custom.iso
          path: ./output/*.iso
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: minios-custom.iso
          path: ./
      
      - name: Get ISO filename
        id: iso
        run: |
          ISO_FILE=$(ls *.iso 2>/dev/null | head -1)
          echo "filename=$ISO_FILE" >> $GITHUB_OUTPUT
          echo "Found ISO: $ISO_FILE"
      
      - name: Delete existing latest release
        if: steps.iso.outputs.filename != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest --repo ${{ github.repository }} &>/dev/null; then
            gh release delete latest --repo ${{ github.repository }} --yes
          fi
      
      - name: Create new latest release
        if: steps.iso.outputs.filename != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISO_FILE="${{ steps.iso.outputs.filename }}"
          
          gh release create latest "$ISO_FILE" \
            --title "MiniOS Custom ISO (Latest Build)" \
            --notes "## MiniOS Custom ISO - Latest Build
          
          ### Build Information
          - **Build Number:** #${{ github.run_number }}
          - **Commit:** ${{ github.sha }}
          - **Branch:** ${{ github.ref_name }}
          - **Build Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          ### Download
          Click on the asset below to download the ISO file.
          
          ### SHA256 Checksum
          \`\`\`
          $(sha256sum "$ISO_FILE")
          \`\`\`
          
          ---
          *This release is automatically updated on every successful build.*
          " \
            --repo ${{ github.repository }}
