name: Build MiniOS Custom ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clone MiniOS repository
        uses: actions/checkout@v5
        with:
          repository: minios-linux/minios-live
          path: minios-live

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap xorriso genisoimage binutils squashfs-tools \
            grub-pc-bin grub-efi-amd64-bin dosfstools mtools xz-utils zstd \
            rsync gettext curl wget gpg

      - name: Setup custom packages and configurations
        run: |
          cd minios-live
          
          # Create necessary directories
          mkdir -p config/{package-lists,chroot-sources,hooks/normal,includes.chroot}
          
          # 1. Package list
          cat > config/package-lists/custom.list.chroot << 'EOF'
          # Base tools
          git curl wget ca-certificates
          # Development tools
          build-essential dkms linux-headers-amd64
          # Network tools
          wireguard-tools openresolv
          # QEMU virtualization
          qemu-system-x86 qemu-utils qemu-kvm ovmf
          # Desktop utilities
          x11-xserver-utils x11-utils vim htop
          # Chinese fonts
          fonts-noto-cjk fonts-noto-color-emoji
          fonts-wqy-zenhei fonts-wqy-microhei
          fonts-liberation fonts-dejavu
          # Input method
          ibus ibus-chewing
          # Fun desktop toy
          oneko
          EOF
          
          # 2. Cloudflare GPG key
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg \
            -o config/chroot-sources/cloudflare-archive-keyring.gpg
          
          # 3. Cloudflare repository
          cat > config/chroot-sources/cloudflare.list << 'EOF'
          deb [signed-by=/usr/share/keyrings/cloudflare-archive-keyring.gpg] https://pkg.cloudflare.com/ trixie main
          EOF
          
          # 4. Main setup hook (all-in-one script)
          cat > config/hooks/normal/01-custom-setup.chroot << 'EOF'
          #!/bin/bash
          set -e
          
          echo "=== Custom Setup Started ==="
          
          # APT third-party sources
          if [ -f /etc/apt/cloudflare-archive-keyring.gpg ]; then
              mkdir -p /usr/share/keyrings/
              cp /etc/apt/cloudflare-archive-keyring.gpg /usr/share/keyrings/
          fi
          if [ -f /etc/apt/cloudflare.list ]; then
              cp /etc/apt/cloudflare.list /etc/apt/sources.list.d/
          fi
          if [ -f /etc/apt/sources.list.d/cloudflare.list ]; then
              apt-get update -o Dir::Etc::sourcelist="/etc/apt/sources.list.d/cloudflare.list" \
                              -o Dir::Etc::sourceparts="/dev/null" || true
          fi
          
          # DKMS modules (apfs-dkms, broadcom-sta)
          if command -v dkms &> /dev/null && dpkg -l | grep -q linux-headers-amd64; then
              apt-get install -y apfs-dkms broadcom-sta-dkms || echo "WARNING: DKMS modules failed"
              dkms autoinstall || echo "WARNING: DKMS build failed"
          fi
          
          # Cloudflare Warp
          if [ -f /etc/apt/sources.list.d/cloudflare.list ]; then
              apt-get install -y cloudflare-warp || echo "WARNING: Warp installation failed"
          fi
          
          # Mise (for live user only)
          if command -v curl &> /dev/null; then
              sudo -u live bash -c "curl https://mise.run | sh" || echo "WARNING: Mise installation failed"
          fi
          
          # Locale
          echo "zh_TW.UTF-8 UTF-8" >> /etc/locale.gen
          echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
          locale-gen
          update-locale LANG=en_US.UTF-8 LANGUAGE=en_US:en LC_ALL=en_US.UTF-8
          
          # Timezone
          echo "Asia/Taipei" > /etc/timezone
          dpkg-reconfigure -f noninteractive tzdata
          ln -sf /usr/share/zoneinfo/Asia/Taipei /etc/localtime 2>/dev/null || true
          
          # Configure live user environment (PATH + Mise + IBus + TZ)
          cat >> /home/live/.bashrc << 'BASHRC'
          
          # Custom PATH
          export PATH="$HOME/bin:$HOME/.local/bin:$PATH"
          
          # Timezone
          export TZ="Asia/Taipei"
          
          # IBus
          export GTK_IM_MODULE=ibus
          export QT_IM_MODULE=ibus
          export XMODIFIERS=@im=ibus
          
          # Mise
          if [ -f "$HOME/.local/bin/mise" ]; then
              eval "$(mise activate bash)"
          fi
          BASHRC
          
          mkdir -p /home/live/bin
          chown live:live /home/live/bin
          
          # IBus system settings
          cat > /etc/default/ibus << 'EOF'
          IBUS_ENABLE_CTRL_ALT_GR=1
          EOF
          
          # Fontconfig (Chinese fonts preference)
          cat > /etc/fonts/conf.d/99-language-selector-zh.conf << 'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
              <alias>
                  <family>sans-serif</family>
                  <prefer>
                      <family>Noto Sans CJK TC</family>
                      <family>WenQuanYi Zen Hei</family>
                      <family>Noto Sans</family>
                  </prefer>
              </alias>
              <alias>
                  <family>serif</family>
                  <prefer>
                      <family>Noto Serif CJK TC</family>
                      <family>WenQuanYi Zen Hei</family>
                      <family>Noto Serif</family>
                  </prefer>
              </alias>
          </fontconfig>
          EOF
          
          # macOS keyboard mapping (system-wide)
          mkdir -p /etc/X11/xorg.conf.d/
          cat > /etc/X11/xorg.conf.d/00-keyboard.conf << 'EOF'
          Section "InputClass"
              Identifier "keyboard"
              MatchIsKeyboard "on"
              Option "XkbLayout" "us,cn"
              Option "XkbVariant" "mac,"
              Option "XkbOptions" "ctrl:swapcaps,altwin:swap_alt_win,grp:alt_shift_toggle"
          EndSection
          EOF
          
          mkdir -p /etc/X11/xmodmap/
          cat > /etc/X11/xmodmap/macos.xmodmap << 'EOF'
          ! macOS style keyboard mapping
          clear control
          clear mod1
          clear mod4
          clear lock
          keycode 64  = Alt_L Meta_L
          keycode 133 = Super_L
          keycode 134 = Super_R
          keycode 108 = Alt_R Meta_R
          keycode 66  = Control_L
          keycode 110 = Home
          keycode 115 = End
          keycode 112 = Prior
          keycode 117 = Next
          add control = Control_L Control_R
          add mod1    = Alt_L Meta_L Alt_R Meta_R
          add mod4    = Super_L Super_R
          add lock    = Caps_Lock
          EOF
          
          # GTK shortcuts (macOS style)
          mkdir -p /etc/gtk-3.0/
          cat > /etc/gtk-3.0/accels.scm << 'EOF'
          (gtk_accel_path "<Actions>/GeditWindow/New" "<Super>n")
          (gtk_accel_path "<Actions>/GeditWindow/Open" "<Super>o")
          (gtk_accel_path "<Actions>/GeditWindow/Save" "<Super>s")
          (gtk_accel_path "<Actions>/GeditWindow/Quit" "<Super>q")
          (gtk_accel_path "<Actions>/GeditWindow/Undo" "<Super>z")
          (gtk_accel_path "<Actions>/GeditWindow/Copy" "<Super>c")
          (gtk_accel_path "<Actions>/GeditWindow/Paste" "<Super>v")
          (gtk_accel_path "<Actions>/GeditWindow/SelectAll" "<Super>a")
          EOF
          
          # User autostart (live user only)
          mkdir -p /home/live/.config/autostart/
          cat > /home/live/.config/autostart/custom-settings.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Custom Settings
          Exec=/bin/bash -c "sleep 2 && ~/.config/autostart/custom-settings.sh"
          Hidden=false
          NoDisplay=false
          X-GNOME-Autostart-enabled=true
          EOF
          
          cat > /home/live/.config/autostart/custom-settings.sh << 'EOF'
          #!/bin/bash
          xrandr -s 1280x800 2>/dev/null || true
          setxkbmap -layout us,cn -variant mac, -option "ctrl:swapcaps,altwin:swap_alt_win,grp:alt_shift_toggle"
          if [ -f /etc/X11/xmodmap/macos.xmodmap ]; then
              xmodmap /etc/X11/xmodmap/macos.xmodmap
          fi
          if command -v ibus-daemon &> /dev/null; then
              ibus-daemon -drx &
          fi
          if command -v oneko &> /dev/null; then
              oneko &
          fi
          exit 0
          EOF
          chmod +x /home/live/.config/autostart/custom-settings.sh
          chown -R live:live /home/live/.config
          
          # Cleanup
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          rm -rf /var/cache/apt/*.bin
          
          echo "=== Custom Setup Completed ==="
          EOF
          
          chmod +x config/hooks/normal/01-custom-setup.chroot

      - name: Build MiniOS ISO
        working-directory: ./minios-live
        run: |
          sudo ./minios-cmd -d trixie -a amd64 -de xfce -pv standard -dkms -kl -c zstd -tz Asia/Taipei

      - name: Collect ISO files
        run: |
          mkdir -p ./output
          find ./minios-live/build/iso -name "*.iso" -exec cp {} ./output/ \;
          echo "ISO file list:"
          ls -lh ./output/

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v5
        with:
          name: minios-custom.iso
          path: ./output/*.iso
          retention-days: 30
