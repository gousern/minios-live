name: trixie-xfce-toolbox-amd64

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clone minios-live Repository
      env:
        REF: ${{ github.event.inputs.tag }}
      run: |
        repo="${{ github.server_url }}/${{ github.repository }}.git"
        if ! git ls-remote --exit-code "$repo" "refs/heads/$REF" "refs/tags/$REF" >/dev/null; then
          echo "::error::Ref '$REF' does not exist in ${{ github.repository }}. Push the tag first: git tag '$REF' && git push origin '$REF'"
          echo "Available tags:"
          git ls-remote --tags "$repo" | awk -F/ '{print $NF}' | grep -v '\^{}' | sort -V | tail -n 15
          exit 1
        fi
        git clone --depth 1 --branch "$REF" "$repo"
        git -C minios-live log -1 --oneline

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          sudo binutils debootstrap squashfs-tools xz-utils lz4 zstd \
          xorriso mtools rsync grub-common gettext \
          dosfstools curl

    - name: Run build - Debian 13 XFCE Toolbox amd64
      run: |
        cd minios-live
        echo "Starting build for Debian 13 XFCE Toolbox amd64"
        
        # Extract version from tag (remove 'v' prefix if present)
        RELEASE_VERSION="${{ github.event.inputs.tag }}"
        RELEASE_VERSION="${RELEASE_VERSION#v}"
        export RELEASE_VERSION
        echo "Building with RELEASE_VERSION: $RELEASE_VERSION"
        
        sudo -E ./minios-cmd -d trixie -a amd64 -de xfce -pv toolbox -dkms -kl -ib dracut
        
        echo "Build completed!"
        sudo mkdir -p build/output/trixie-xfce-toolbox-amd64
        sudo mv build/iso/*.iso build/output/trixie-xfce-toolbox-amd64/
        sudo mv build/iso/*.sha256 build/output/trixie-xfce-toolbox-amd64/ || true

    - name: Verify ISO contents
      run: |
        set -o pipefail
        cd minios-live || exit 1
        chmod +x verify-iso.sh
        ISO=$(ls build/output/trixie-xfce-toolbox-amd64/*.iso | head -1)
        echo "verifying: $ISO"
        ./verify-iso.sh "$ISO" | tee verify-report.txt

    - name: Archive build output - Debian 13 XFCE Toolbox amd64
      uses: actions/upload-artifact@v4
      with:
        name: minios-trixie-xfce-toolbox-amd64
        path: minios-live/build/output/trixie-xfce-toolbox-amd64

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Set Release Tag Name
        id: set_tag
        run: echo "tag_name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo=${{ github.repository }}
          tag_name=${{ steps.set_tag.outputs.tag_name }}
          
          # Create release if it doesn't exist
          gh release view "$tag_name" --repo "$repo" >/dev/null 2>&1 || \
            gh release create "$tag_name" --repo "$repo" --title "$tag_name" --generate-notes
          
          # Upload all artifacts
          for artifact_dir in ./artifacts/*; do
            for artifact in "$artifact_dir"/*; do
              gh release upload "$tag_name" "$artifact" --repo "$repo" --clobber
            done
          done